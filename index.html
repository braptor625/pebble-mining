<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pebble Miner</title>
<style>
  :root {
    --bg: #1b1d22; --panel: #262932; --panel2: #2f333e; --ink: #e9e6dc; --dim: #9a978d;
    --accent: #f2c14e; --good: #6fcf6b; --bad: #e0605a; --line: #3b404d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; user-select: none; }
  #app { display: flex; gap: 24px; justify-content: center; align-items: flex-start; padding: 20px 16px; flex-wrap: wrap; }

  /* Pebble watch frame */
  .watch { position: relative; padding: 46px 30px; background: linear-gradient(160deg, #3d424d, #22252c);
    border-radius: 42px; box-shadow: 0 18px 40px #0008, inset 0 2px 0 #fff2, inset 0 -3px 0 #0006; }
  .watch::before, .watch::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    width: 62%; height: 40px; background: #15161a; border-radius: 6px; }
  .watch::before { top: -32px; } .watch::after { bottom: -32px; }
  .btn-side { position: absolute; width: 8px; height: 46px; background: #4a4f5c; border-radius: 3px; }
  .btn-side.l { left: -6px; top: 120px; }
  .btn-side.r1 { right: -6px; top: 80px; } .btn-side.r2 { right: -6px; top: 210px; } .btn-side.r3 { right: -6px; top: 340px; }
  .screen { background: #000; padding: 6px; border-radius: 6px; box-shadow: inset 0 0 0 2px #111; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer;
    width: 432px; height: 504px; touch-action: none; }
  .brand { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: 3px; color: #8a8f9c; }

  /* side panel */
  .side { width: 400px; max-width: 100%; }
  .hud { background: var(--panel); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .money { font-size: 26px; color: var(--accent); font-weight: bold; }
  .sub { color: var(--dim); font-size: 12px; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .bar { height: 8px; background: #16181d; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #8b5cf6, #f2c14e); width: 0; }
  .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .tab { flex: 1; text-align: center; padding: 8px 0; background: var(--panel); border-radius: 8px; cursor: pointer; color: var(--dim); }
  .tab.on { background: var(--panel2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .pane { background: var(--panel); border-radius: 12px; padding: 10px; min-height: 380px; }
  .item { background: var(--panel2); border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; cursor: pointer;
    border: 1px solid transparent; transition: transform .05s; }
  .item:hover { border-color: var(--line); }
  .item:active { transform: scale(.985); }
  .item.no { opacity: .5; cursor: default; }
  .item.max { opacity: .6; cursor: default; }
  .item .t { font-weight: bold; }
  .item .cost { color: var(--accent); font-weight: bold; white-space: nowrap; }
  .item.no .cost { color: var(--bad); }
  .item .d { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .lv { color: var(--dim); font-weight: normal; font-size: 12px; }
  .ore-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 6px 0 12px; }
  .ore { background: var(--panel2); border-radius: 6px; padding: 5px 6px; font-size: 11px; display: flex; gap: 6px; align-items: center; }
  .sw { width: 12px; height: 12px; border-radius: 2px; flex: none; box-shadow: inset 0 0 0 1px #0005; }
  h3 { margin: 6px 2px 4px; font-size: 13px; }
  .big { width: 100%; padding: 12px; border-radius: 10px; border: 0; font: inherit; font-weight: bold; cursor: pointer;
    background: var(--accent); color: #222; margin-top: 8px; }
  .big:disabled { background: #555; color: #999; cursor: default; }
  .big.red { background: var(--bad); color: #fff; }
  .toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: #111c; border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 10px; pointer-events: none; transition: opacity .4s; z-index: 5; text-align: center; }
  .modal { position: fixed; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal.on { display: flex; }
  .modal .box { background: var(--panel); border-radius: 14px; padding: 22px; max-width: 360px; text-align: center; margin: 16px; }
  .modal h2 { margin: 0 0 8px; color: var(--accent); }
  .tool { display: flex; gap: 6px; margin-top: 8px; }
  .tool .item { flex: 1; margin: 0; text-align: center; }
  .tool .item.on { border-color: var(--accent); }
  @media (max-width: 520px) {
    canvas { width: 288px; height: 336px; }
    .watch { padding: 34px 18px; border-radius: 30px; }
    .btn-side { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="watch">
    <div class="btn-side l"></div><div class="btn-side r1"></div><div class="btn-side r2"></div><div class="btn-side r3"></div>
    <div class="screen"><canvas id="c" width="144" height="168"></canvas></div>
    <div class="brand">PEBBLE MINER</div>
  </div>
  <div class="side">
    <div class="hud">
      <div class="row"><div class="money" id="money">$0</div><div class="sub" id="income"></div></div>
      <div class="row sub"><span id="worldName"></span><span id="depth"></span></div>
      <div class="bar"><i id="goalBar"></i></div>
      <div class="sub" id="goalText" style="margin-top:4px"></div>
      <div class="tool">
        <div class="item" id="dynBtn"><span class="t">Dynamite</span> <span class="lv" id="dynCount"></span></div>
        <div class="item" id="dynBuy"><span class="t">Buy</span> <span class="cost" id="dynCost"></span></div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on" data-tab="shop">Shop</div>
      <div class="tab" data-tab="worlds">Worlds</div>
      <div class="tab" data-tab="codex">Codex</div>
      <div class="tab" data-tab="reforge">Reforge</div>
      <div class="tab" data-tab="more">More</div>
    </div>
    <div class="pane" id="pane"></div>
  </div>
</div>
<div class="toast" id="toast" style="opacity:0"></div>
<div class="modal" id="modal"><div class="box"><h2 id="mTitle"></h2><div id="mBody"></div><button class="big" id="mOk">OK</button></div></div>

<script>
"use strict";
// ---------------------------------------------------------------- constants
const VW = 144, VH = 168, T = 16, COLS = 9, PLAYER_ROW = 3;
const SAVE_KEY = "pebbleMinerSave.v1";

// Each world: palette + ore list. Ore: [name, color, value multiplier, chance, min depth fraction of goal]
const WORLDS = [
  { name: "Verdant Hills", goal: 100, sky: ["#8fd3ff", "#d8f1ff"], top: "#5fbf4a",
    layers: ["#8b5a2b", "#74706a", "#55535a"], speck: "#00000033",
    ores: [["Coal", "#2b2b2b", 1, .12, 0], ["Copper", "#d9814a", 3, .07, .08], ["Iron", "#c9b7a6", 8, .045, .2],
           ["Silver", "#e6eef2", 20, .025, .35], ["Gold", "#ffd23f", 60, .012, .5], ["Emerald", "#36e07a", 200, .005, .7], ["Diamond", "#8ff4ff", 800, .002, .85]] },
  { name: "Sunscorch Desert", goal: 150, sky: ["#ffb35c", "#ffe7b0"], top: "#f1d58a",
    layers: ["#e0bb6e", "#c48a4a", "#9a5f35"], speck: "#5a2e0f33",
    ores: [["Amber", "#ff9f1c", 1, .12, 0], ["Turquoise", "#3fd0c9", 3, .07, .08], ["Topaz", "#ffcc66", 8, .045, .2],
           ["Scarab Gem", "#2e9e5b", 20, .025, .35], ["Sunstone", "#ff6b3d", 60, .012, .5], ["Pharaoh Gold", "#ffe14d", 200, .005, .7], ["Desert Rose", "#ff7ab8", 800, .002, .85]] },
  { name: "Frostveil Peaks", goal: 200, sky: ["#a7c7e7", "#f0f7ff"], top: "#ffffff",
    layers: ["#bcd9f0", "#7d9cc0", "#4f6a90"], speck: "#ffffff44",
    ores: [["Frost Quartz", "#e8fbff", 1, .12, 0], ["Glacite", "#7fd6ff", 3, .07, .08], ["Sapphire", "#2f6bff", 8, .045, .2],
           ["Mithril", "#c0d8e8", 20, .025, .35], ["Aurorite", "#7bffb5", 60, .012, .5], ["Starfrost", "#d6a8ff", 200, .005, .7], ["Frozen Heart", "#ff4d6d", 800, .002, .85]] },
  { name: "Ember Depths", goal: 250, sky: ["#3b0d0d", "#8a2b12"], top: "#2a1a1a",
    layers: ["#4a3330", "#3a2626", "#2a1b1d"], speck: "#ff6a0033",
    ores: [["Sulfur", "#e8e24a", 1, .12, 0], ["Obsidian", "#5c3b8a", 3, .07, .08], ["Ruby", "#ff2e4d", 8, .045, .2],
           ["Magmite", "#ff7b00", 20, .025, .35], ["Fire Opal", "#ffb08a", 60, .012, .5], ["Dragonglass", "#00e0a0", 200, .005, .7], ["Phoenix Ember", "#fff27a", 800, .002, .85]] },
  { name: "Lunar Basin", goal: 300, sky: ["#05060f", "#1a1d33"], top: "#cfcfd6",
    layers: ["#a9a9b3", "#7c7c88", "#55555f"], speck: "#00000040",
    ores: [["Moon Dust", "#e9e9f2", 1, .12, 0], ["Helium-3", "#9fe7ff", 3, .07, .08], ["Meteorite", "#8a6f5a", 8, .045, .2],
           ["Starsteel", "#b8c6ff", 20, .025, .35], ["Lunarium", "#f6ffb0", 60, .012, .5], ["Comet Core", "#5cf0ff", 200, .005, .7], ["Moonheart", "#ffffff", 800, .002, .85]] },
  { name: "Crystal Abyss", goal: 400, sky: ["#1a0b2e", "#3d1b6b"], top: "#7a4fd1",
    layers: ["#5a3b8f", "#432a70", "#2e1b52"], speck: "#ff9cf733",
    ores: [["Amethyst", "#b46bff", 1, .12, 0], ["Rose Quartz", "#ffa3d1", 3, .07, .08], ["Prismite", "#9cf6ff", 8, .045, .2],
           ["Opal", "#ffeef7", 20, .025, .35], ["Voidglass", "#3affd4", 60, .012, .5], ["Chroma Shard", "#ff5ce1", 200, .005, .7], ["Heart Crystal", "#ff2d6f", 800, .002, .85]] },
  { name: "The Void", goal: 500, sky: ["#000000", "#0b0716"], top: "#1a1426",
    layers: ["#1c1730", "#140f24", "#0b0815"], speck: "#a78bfa30",
    ores: [["Echo Stone", "#6f6a8a", 1, .12, 0], ["Nebulite", "#c77dff", 3, .07, .08], ["Dark Matter", "#3a0ca3", 8, .045, .2],
           ["Starseed", "#ffe66d", 20, .025, .35], ["Quasar", "#4cc9f0", 60, .012, .5], ["Singularity", "#ffffff", 200, .005, .7], ["Cosmic Egg", "#ff9e00", 800, .002, .85]] },
];

// world scaling chained so each new world starts slightly tougher/richer than where the last ended
const hpCurve = d => (1 + d / 6) * Math.pow(1.012, d);
const valCurve = d => (1 + d / 7) * Math.pow(1.013, d);
WORLDS.forEach((w, i) => {
  w.hm = i ? WORLDS[i - 1].hm * hpCurve(WORLDS[i - 1].goal) * 0.6 : 1;
  w.vm = i ? WORLDS[i - 1].vm * valCurve(WORLDS[i - 1].goal) * 0.75 : 1;
});

const UPGRADES = [
  { id: "pick", name: "Pickaxe", desc: l => `Damage ${fmt(pickDmg(l))} → ${fmt(pickDmg(l + 1))}`, cost: l => 8 * Math.pow(1.24, l) },
  { id: "speed", name: "Swift Gloves", max: 24, desc: l => `${swingRate(l).toFixed(1)} → ${swingRate(l + 1).toFixed(1)} swings/sec while holding`, cost: l => 40 * Math.pow(1.9, l) },
  { id: "luck", name: "Lucky Lantern", max: 50, desc: l => `Ore chance x${luckMult(l).toFixed(2)} → x${luckMult(l + 1).toFixed(2)}`, cost: l => 60 * Math.pow(1.55, l) },
  { id: "refine", name: "Refinery", desc: l => `Ore value x${refineMult(l).toFixed(2)} → x${refineMult(l + 1).toFixed(2)}`, cost: l => 100 * Math.pow(1.45, l) },
  { id: "drill", name: "Auto-Drill", max: 20, desc: l => `Digs below you ${drillRate(l).toFixed(1)} → ${drillRate(l + 1).toFixed(1)} hits/sec`, cost: l => 250 * Math.pow(1.8, l) },
  { id: "robots", name: "Mining Robot", desc: l => `${l} robots · +${fmt(robotIncome(l + 1) - robotIncome(l))}/sec more`, cost: l => 150 * Math.pow(1.16, l) },
];
const pickDmg = l => (1 + l * 0.5) * Math.pow(1.17, l) * bonusMult();
const swingRate = l => 3 + l * 0.5;
const luckMult = l => 1 + l * 0.08;
const refineMult = l => 1 + l * 0.25;
const drillRate = l => l * 0.6;

// ---------------------------------------------------------------- state
let S;
function freshRun(keep) {
  return {
    money: 0, runEarned: 0, totalEarned: keep ? keep.totalEarned : 0, shards: keep ? keep.shards : 0,
    world: 0, unlocked: keep ? keep.unlocked : 1, dyn: 2,
    up: { pick: 0, speed: 0, luck: 0, refine: 0, drill: 0, robots: 0 },
    worlds: WORLDS.map(() => ({ x: 4, y: 0, max: 0, rows: {} })),
    codex: keep ? keep.codex : {}, sound: keep ? keep.sound : true, won: keep ? keep.won : false,
    stats: keep ? keep.stats : { blocks: 0, ores: 0, reforges: 0, chests: 0, time: 0 },
    last: Date.now(),
  };
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { S = Object.assign(freshRun(), JSON.parse(raw)); return true; }
  } catch (e) {}
  S = freshRun(); return false;
}
function save() { S.last = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

const W = () => WORLDS[S.world];
const WS = () => S.worlds[S.world];
function codexBonus() {
  let n = 0, full = 0;
  WORLDS.forEach((w, wi) => { let c = 0; w.ores.forEach((o, oi) => { if (S.codex[wi + ":" + oi]) c++; }); n += c; if (c === w.ores.length) full++; });
  return 1 + n * 0.02 + full * 0.1;
}
const bonusMult = () => 1 + S.shards * 0.1;
const valueMult = () => refineMult(S.up.refine) * bonusMult() * codexBonus();
function baseValue(wi, d) { return 2 * WORLDS[wi].vm * valCurve(d); }
function baseHp(wi, d) { return 2 * WORLDS[wi].hm * hpCurve(d); }
function robotIncome(n) { return n * 0.05 * baseValue(S.world, Math.max(WS().max, 1)) * valueMult() * (1 + Math.floor(n / 25) * 0.5); }
function dynCost() { return 30 * baseValue(S.world, Math.max(WS().y, 1)) * valueMult(); }

// ---------------------------------------------------------------- mine generation
function hash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function tileAt(x, y) {
  if (y <= 0) return null;
  const w = W();
  if (y === w.goal) return { k: "portal" };
  if (hash(x, y, S.world * 7 + 1) < 0.004) return { k: "chest" };
  const h = hash(x, y, S.world * 7 + 2), lm = luckMult(S.up.luck);
  let acc = 0;
  for (let i = w.ores.length - 1; i >= 0; i--) {
    const o = w.ores[i];
    if (y < o[4] * w.goal) continue;
    acc += o[3] * lm;
    if (h < acc) return { k: "ore", i };
  }
  return { k: "rock" };
}
const isMined = (x, y) => ((WS().rows[y] || 0) >> x) & 1;
const solid = (x, y) => x >= 0 && x < COLS && y > 0 && !isMined(x, y);
function tileHp(t, y) {
  const b = baseHp(S.world, y);
  if (t.k === "portal") return b * 40;
  if (t.k === "chest") return b * 2;
  if (t.k === "ore") return b * (1.3 + t.i * 0.3);
  return b;
}
function tileValue(t, y) {
  const b = baseValue(S.world, y) * valueMult();
  if (t.k === "ore") return b * W().ores[t.i][2];
  if (t.k === "chest") return b * 60;
  if (t.k === "portal") return b * 200;
  return b * 0.15;
}

// ---------------------------------------------------------------- game actions
let cur = null; // current block being damaged {x,y,dmg,max}
const fx = [], pops = [];
let shake = 0;

function earn(v) { S.money += v; S.runEarned += v; S.totalEarned += v; }

function hit(x, y, dmg, silent) {
  if (!solid(x, y)) return false;
  const t = tileAt(x, y);
  if (!cur || cur.x !== x || cur.y !== y || cur.w !== S.world) cur = { x, y, w: S.world, dmg: 0, max: tileHp(t, y) };
  cur.dmg += dmg;
  if (!silent) { sfx("hit"); debris(x, y, tileColor(t, y), 3); }
  if (cur.dmg >= cur.max) { breakTile(x, y, t); cur = null; return true; }
  return false;
}
function breakTile(x, y, t) {
  const ws = WS();
  ws.rows[y] = (ws.rows[y] || 0) | (1 << x);
  S.stats.blocks++;
  const v = tileValue(t, y);
  earn(v);
  debris(x, y, tileColor(t, y), 10);
  if (t.k === "ore") {
    const o = W().ores[t.i], key = S.world + ":" + t.i;
    S.stats.ores++;
    pop(x, y, "+" + fmt(v), o[1]);
    sfx(t.i >= 4 ? "rare" : "ore");
    if (!S.codex[key]) { S.codex[key] = 1; toast(`New ore discovered: <b style="color:${o[1]}">${o[0]}</b>`); }
  } else if (t.k === "chest") {
    S.stats.chests++;
    const d = 1 + (hash(x, y, 99) * 3 | 0);
    S.dyn += d;
    pop(x, y, "+" + fmt(v), "#ffd23f");
    toast(`Treasure chest! +${fmt(v)} and ${d} dynamite`);
    sfx("rare");
  } else if (t.k === "portal") {
    pop(x, y, "+" + fmt(v), "#ff7bff");
    sfx("portal"); shake = 10;
    if (S.world + 1 < WORLDS.length && S.unlocked <= S.world + 1) {
      S.unlocked = S.world + 2;
      showModal("Portal opened!", `You broke through the core of <b>${W().name}</b>.<br><br>A new world awaits: <b>${WORLDS[S.world + 1].name}</b>.<br>Ores there are worth far more — but the rock is tougher.<br><br>Travel from the <b>Worlds</b> tab whenever you're ready.`);
    } else if (S.world === WORLDS.length - 1 && !S.won) {
      S.won = true;
      showModal("The heart of the Void", `You've dug through all seven worlds. Legendary.<br><br>The mines go on forever — keep digging, Reforge for shards, and complete your Codex.`);
    }
  } else {
    if (Math.random() < 0.3) pop(x, y, "+" + fmt(v), "#ddd");
    sfx("break");
  }
}
function act(tx, ty) {
  // one step of "go toward / dig toward" the clicked tile
  const ws = WS(), px = ws.x, py = ws.y;
  if (tx === px && ty === py) return null;
  const dx = Math.sign(tx - px), dy = Math.sign(ty - py);
  const opts = [];
  if (dy > 0 && Math.abs(ty - py) >= Math.abs(tx - px)) opts.push([0, 1]);
  if (dx) opts.push([dx, 0]);
  if (dy > 0) opts.push([0, 1]);
  if (dy < 0) opts.push([0, -1]);
  for (const [ox, oy] of opts) {
    const nx = px + ox, ny = py + oy;
    if (nx < 0 || nx >= COLS || ny < 0) continue;
    if (solid(nx, ny)) { hit(nx, ny, pickDmg(S.up.pick)); swingAnim = 1; return "hit"; }
    if (oy < 0) continue; // can't climb, gravity wins
    ws.x = nx; ws.y = ny; return "move";
  }
  return null;
}
function nextTarget(tx, ty) {
  // used for the hover outline: which tile would act() hit
  const ws = WS(), px = ws.x, py = ws.y;
  if (tx === px && ty === py) return null;
  const dx = Math.sign(tx - px), dy = Math.sign(ty - py);
  const opts = [];
  if (dy > 0 && Math.abs(ty - py) >= Math.abs(tx - px)) opts.push([0, 1]);
  if (dx) opts.push([dx, 0]);
  if (dy > 0) opts.push([0, 1]);
  if (dy < 0) opts.push([0, -1]);
  for (const [ox, oy] of opts) {
    const nx = px + ox, ny = py + oy;
    if (nx < 0 || nx >= COLS || ny < 0) continue;
    if (solid(nx, ny)) return [nx, ny];
    if (oy < 0) continue;
    return [nx, ny];
  }
  return null;
}
function dynamite(tx, ty) {
  const ws = WS();
  if (S.dyn <= 0) return;
  if (Math.abs(tx - ws.x) > 4 || Math.abs(ty - ws.y) > 4 || ty < 1) { toast("Too far away — dynamite must be within 4 tiles"); return; }
  S.dyn--; armed = false; shake = 8; sfx("boom");
  for (let y = ty - 1; y <= ty + 1; y++) for (let x = tx - 1; x <= tx + 1; x++) {
    if (!solid(x, y)) continue;
    const t = tileAt(x, y);
    if (t.k === "portal") hit(x, y, tileHp(t, y) * 0.2, true);
    else { cur = null; breakTile(x, y, t); }
  }
  for (let i = 0; i < 30; i++) fx.push({ x: tx * T + 8, y: ty * T + 8, vx: (Math.random() - .5) * 160, vy: (Math.random() - .7) * 160, c: ["#ffd23f", "#ff7b00", "#fff", "#555"][i % 4], l: .6 + Math.random() * .4 });
}

// ---------------------------------------------------------------- effects
function tileColor(t, y) {
  if (!t) return "#fff";
  if (t.k === "ore") return W().ores[t.i][1];
  if (t.k === "chest") return "#b07a3a";
  if (t.k === "portal") return "#ff7bff";
  return layerColor(y);
}
function debris(x, y, c, n) {
  for (let i = 0; i < n; i++) fx.push({ x: x * T + 8, y: y * T + 8, vx: (Math.random() - .5) * 90, vy: -Math.random() * 90, c, l: .4 + Math.random() * .4 });
}
function pop(x, y, txt, c) { pops.push({ x: x * T + 8, y: y * T + 4, txt, c, l: 1.1 }); }

let actx = null;
function sfx(type) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { hit: [[180 + Math.random() * 60, .03]], break: [[320, .04], [200, .05]], ore: [[660, .05], [880, .07]],
      rare: [[660, .06], [880, .06], [1320, .1]], portal: [[440, .1], [554, .1], [659, .1], [880, .25]], boom: [[90, .25]], buy: [[520, .04], [780, .06]] }[type];
    let t = actx.currentTime;
    for (const [f, d] of notes) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type === "boom" ? "sawtooth" : "square"; o.frequency.value = f;
      g.gain.setValueAtTime(type === "hit" ? .03 : .05, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d); t += d * .8;
    }
  } catch (e) {}
}

// ---------------------------------------------------------------- rendering
const cv = document.getElementById("c"), cx = cv.getContext("2d");
cx.imageSmoothingEnabled = false;
let camY = 0, drawX = 4, drawY = 0, swingAnim = 0, hover = null, armed = false;

function mix(a, b, t) {
  const pa = parseInt(a.slice(1, 7), 16), pb = parseInt(b.slice(1, 7), 16);
  const r = (pa >> 16) * (1 - t) + (pb >> 16) * t, g = ((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t, bl = (pa & 255) * (1 - t) + (pb & 255) * t;
  return "#" + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
function layerColor(y) {
  const L = W().layers, f = Math.min(y / W().goal, 1.5) * (L.length - 1) / 1.0;
  const i = Math.min(Math.floor(f), L.length - 2);
  return mix(L[i], L[i + 1], Math.min(f - i, 1));
}
function drawTile(x, y, sx, sy, now) {
  const t = tileAt(x, y), w = W();
  const base = layerColor(y);
  cx.fillStyle = base; cx.fillRect(sx, sy, T, T);
  // speckles
  cx.fillStyle = w.speck;
  for (let i = 0; i < 5; i++) { const h = hash(x, y, 31 + i); cx.fillRect(sx + (h * 14 | 0), sy + (hash(y, x, 57 + i) * 14 | 0), 2, 1); }
  cx.fillStyle = "#ffffff14"; cx.fillRect(sx, sy, T, 1);
  cx.fillStyle = "#0000002a"; cx.fillRect(sx, sy + T - 1, T, 1);
  if (y === 1) { cx.fillStyle = w.top; cx.fillRect(sx, sy, T, 3); cx.fillRect(sx + (hash(x, 0, 3) * 12 | 0), sy + 3, 2, 2); }
  if (t.k === "ore") {
    const c = w.ores[t.i][1];
    for (let i = 0; i < 4 + t.i; i++) {
      const ox = 2 + (hash(x, y, 70 + i) * 10 | 0), oy = 2 + (hash(x, y, 90 + i) * 10 | 0);
      cx.fillStyle = c; cx.fillRect(sx + ox, sy + oy, 3, 3);
      cx.fillStyle = "#ffffff88"; cx.fillRect(sx + ox, sy + oy, 1, 1);
    }
    if (t.i >= 4 && (now / 300 + x + y) % 6 < 1) { cx.fillStyle = "#fff"; cx.fillRect(sx + 7, sy + 3, 1, 3); cx.fillRect(sx + 6, sy + 4, 3, 1); }
  } else if (t.k === "chest") {
    cx.fillStyle = "#6b4321"; cx.fillRect(sx + 2, sy + 5, 12, 9);
    cx.fillStyle = "#b07a3a"; cx.fillRect(sx + 3, sy + 6, 10, 3); cx.fillRect(sx + 3, sy + 10, 10, 3);
    cx.fillStyle = "#ffd23f"; cx.fillRect(sx + 7, sy + 8, 2, 3);
  } else if (t.k === "portal") {
    const p = (now / 200) % 16;
    cx.fillStyle = "#2a0838"; cx.fillRect(sx, sy, T, T);
    for (let i = 0; i < 4; i++) { cx.fillStyle = ["#ff7bff", "#9b5cff", "#5cf0ff", "#fff"][i]; cx.fillRect(sx + ((p + i * 4 + x * 3) % 16), sy + ((i * 5 + y) % 14) + 1, 2, 2); }
    cx.strokeStyle = "#ff7bff"; cx.strokeRect(sx + .5, sy + .5, T - 1, T - 1);
  }
  if (cur && cur.x === x && cur.y === y && cur.w === S.world) {
    const f = cur.dmg / cur.max;
    cx.fillStyle = "#000000aa";
    if (f > .0) { cx.fillRect(sx + 7, sy + 3, 1, 5); cx.fillRect(sx + 8, sy + 7, 3, 1); }
    if (f > .33) { cx.fillRect(sx + 3, sy + 9, 5, 1); cx.fillRect(sx + 10, sy + 8, 1, 5); }
    if (f > .66) { cx.fillRect(sx + 2, sy + 3, 1, 4); cx.fillRect(sx + 11, sy + 2, 3, 1); cx.fillRect(sx + 5, sy + 12, 4, 1); }
  }
}
function drawMiner(sx, sy, now) {
  const blink = (now % 3000) < 120;
  cx.fillStyle = "#3a6ee8"; cx.fillRect(sx + 4, sy + 8, 8, 6);   // body
  cx.fillStyle = "#24408a"; cx.fillRect(sx + 4, sy + 14, 3, 2); cx.fillRect(sx + 9, sy + 14, 3, 2); // boots
  cx.fillStyle = "#f2c8a0"; cx.fillRect(sx + 5, sy + 4, 6, 4);   // face
  cx.fillStyle = blink ? "#f2c8a0" : "#222"; cx.fillRect(sx + 6, sy + 5, 1, 1); cx.fillRect(sx + 9, sy + 5, 1, 1);
  cx.fillStyle = "#f2c14e"; cx.fillRect(sx + 4, sy + 1, 8, 3);   // helmet
  cx.fillStyle = "#fff8b0"; cx.fillRect(sx + 7, sy + 1, 2, 2);   // lamp
  // pickaxe
  const a = swingAnim > 0 ? -0.9 + (1 - swingAnim) * 1.8 : 0.5;
  cx.save(); cx.translate(sx + 12, sy + 10); cx.rotate(a);
  cx.fillStyle = "#8b5a2b"; cx.fillRect(0, -1, 7, 2);
  cx.fillStyle = "#cfd6de"; cx.fillRect(5, -4, 2, 8);
  cx.restore();
}
function render(now) {
  const w = W(), ws = WS();
  const sh = shake > 0 ? (Math.random() - .5) * shake : 0;
  cx.setTransform(1, 0, 0, 1, sh, 0);
  // sky
  const g = cx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, w.sky[0]); g.addColorStop(1, w.sky[1]);
  cx.fillStyle = g; cx.fillRect(-10, 0, VW + 20, VH);
  const oy = Math.round(camY * T);
  if (camY < 2) { // surface decoration
    cx.fillStyle = "#ffffff55";
    cx.fillRect(((now / 80) % 180) - 30, 10 - oy, 18, 4); cx.fillRect(((now / 120 + 90) % 180) - 30, 20 - oy, 12, 3);
  }
  const top = Math.floor(camY);
  for (let y = top; y <= top + 11; y++) for (let x = 0; x < COLS; x++) {
    const sx = x * T, sy = y * T - oy;
    if (solid(x, y)) drawTile(x, y, sx, sy, now);
    else if (y > 0) { cx.fillStyle = mix(layerColor(y), "#000000", .65); cx.fillRect(sx, sy, T, T); }
  }
  // hover outline
  if (hover && !armed) {
    const nt = nextTarget(hover[0], hover[1]);
    if (nt) { cx.strokeStyle = solid(nt[0], nt[1]) ? "#ffffffcc" : "#ffffff55"; cx.strokeRect(nt[0] * T + .5, nt[1] * T - oy + .5, T - 1, T - 1); }
  }
  if (hover && armed) {
    cx.strokeStyle = "#ff5a3c"; cx.strokeRect((hover[0] - 1) * T + .5, (hover[1] - 1) * T - oy + .5, T * 3 - 1, T * 3 - 1);
  }
  drawMiner(Math.round(drawX * T), Math.round(drawY * T) - oy, now);
  // darkness deepens with depth, lantern around player
  const dark = Math.min(0.75, ws.y / w.goal * 0.6 + (S.world >= 3 ? 0.15 : 0));
  if (dark > 0.02) {
    const px = drawX * T + 8, py = drawY * T - oy + 8, r = 46 + S.up.luck * 1.2;
    const rg = cx.createRadialGradient(px, py, 8, px, py, r);
    rg.addColorStop(0, "rgba(0,0,0,0)"); rg.addColorStop(1, `rgba(0,0,0,${dark})`);
    cx.fillStyle = rg; cx.fillRect(-10, 0, VW + 20, VH);
  }
  for (const p of fx) { cx.fillStyle = p.c; cx.fillRect(p.x | 0, (p.y - oy) | 0, 2, 2); }
  cx.font = "bold 8px monospace"; cx.textAlign = "center";
  for (const p of pops) {
    cx.globalAlpha = Math.min(1, p.l * 2);
    cx.fillStyle = "#000"; cx.fillText(p.txt, p.x + 1, p.y - oy + 1);
    cx.fillStyle = p.c; cx.fillText(p.txt, p.x, p.y - oy);
  }
  cx.globalAlpha = 1;
  // depth label
  cx.textAlign = "left"; cx.fillStyle = "#000a"; cx.fillRect(0, 0, cx.measureText(ws.y + "m").width + 6, 11);
  cx.fillStyle = "#fff"; cx.fillText(ws.y + "m", 3, 8);
}

// ---------------------------------------------------------------- input (mouse / touch)
let holding = false, pointer = null, nextSwing = 0;
function tileFromEvent(e) {
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) / r.width * VW, my = (e.clientY - r.top) / r.height * VH;
  return [Math.max(0, Math.min(COLS - 1, Math.floor(mx / T))), Math.floor((my + camY * T) / T), mx, my];
}
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  pointer = e; hover = tileFromEvent(e);
  if (armed) { dynamite(hover[0], hover[1]); return; }
  holding = true; nextSwing = 0;
});
cv.addEventListener("pointermove", e => { pointer = e; hover = tileFromEvent(e); });
window.addEventListener("pointerup", () => { holding = false; });
cv.addEventListener("pointerleave", () => { if (!holding) hover = null; });
cv.addEventListener("contextmenu", e => e.preventDefault());

// ---------------------------------------------------------------- loop
let lastT = performance.now(), drillAcc = 0, uiAcc = 0, saveAcc = 0, fallAcc = 0;
function update(dt, now) {
  const ws = WS();
  S.stats.time += dt;
  if (holding && pointer && now >= nextSwing) {
    hover = tileFromEvent(pointer);
    const r = act(hover[0], hover[1]);
    const iv = 1000 / swingRate(S.up.speed);
    nextSwing = now + (r === "move" ? Math.min(iv, 110) : iv);
  }
  // gravity
  fallAcc += dt;
  if (!solid(ws.x, ws.y + 1) && fallAcc > 0.05) { ws.y++; fallAcc = 0; }
  if (ws.y > ws.max) ws.max = ws.y;
  // auto drill
  const dr = drillRate(S.up.drill);
  if (dr > 0) {
    drillAcc += dt * dr;
    while (drillAcc >= 1) { drillAcc--; if (solid(ws.x, ws.y + 1)) hit(ws.x, ws.y + 1, pickDmg(S.up.pick), true); }
  }
  // robots
  if (S.up.robots) earn(robotIncome(S.up.robots) * dt);
  // tween / fx
  drawX += (ws.x - drawX) * Math.min(1, dt * 18);
  drawY += (ws.y - drawY) * Math.min(1, dt * 18);
  if (Math.abs(ws.y - drawY) > 6) drawY = ws.y;
  camY += (drawY - PLAYER_ROW - camY) * Math.min(1, dt * 8);
  if (camY < -0.5) camY = -0.5;
  swingAnim = Math.max(0, swingAnim - dt * 6);
  shake = Math.max(0, shake - dt * 30);
  for (let i = fx.length - 1; i >= 0; i--) { const p = fx[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.l -= dt; if (p.l <= 0) fx.splice(i, 1); }
  for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.y -= 14 * dt; p.l -= dt; if (p.l <= 0) pops.splice(i, 1); }
  uiAcc += dt; if (uiAcc > .2) { uiAcc = 0; updateUI(); }
  saveAcc += dt; if (saveAcc > 10) { saveAcc = 0; save(); }
}
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  update(dt, now); render(now);
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- UI
const $ = id => document.getElementById(id);
function fmt(n) {
  if (!isFinite(n)) return "∞";
  if (n < 10) return (Math.floor(n * 10) / 10).toString();
  if (n < 1000) return Math.floor(n).toString();
  const u = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
  const e = Math.floor(Math.log10(n) / 3);
  if (e < u.length) return (n / Math.pow(1000, e)).toFixed(n / Math.pow(1000, e) < 100 ? 2 : 1) + u[e];
  return n.toExponential(2).replace("+", "");
}
let tab = "shop", reforgeConfirm = false, resetConfirm = 0;
document.querySelectorAll(".tab").forEach(el => el.addEventListener("click", () => {
  tab = el.dataset.tab; reforgeConfirm = false; resetConfirm = 0;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === el));
  renderPane();
}));
function pendingShards() { return Math.floor(Math.sqrt(S.runEarned / 1e5)); }

function renderPane() {
  const p = $("pane");
  if (tab === "shop") {
    p.innerHTML = UPGRADES.map(u => {
      const l = S.up[u.id], max = u.max && l >= u.max, c = u.cost(l);
      return `<div class="item ${max ? "max" : S.money < c ? "no" : ""}" data-up="${u.id}">
        <div class="row"><span class="t">${u.name} <span class="lv">Lv ${l}${u.max ? "/" + u.max : ""}</span></span>
        <span class="cost">${max ? "MAX" : "$" + fmt(c)}</span></div><div class="d">${max ? "Fully upgraded" : u.desc(l)}</div></div>`;
    }).join("") + `<div class="sub" style="margin-top:6px">Tip: hold the mouse button to keep digging. Click anywhere and your miner digs toward it.</div>`;
    p.querySelectorAll("[data-up]").forEach(el => el.addEventListener("click", () => buy(el.dataset.up)));
  } else if (tab === "worlds") {
    p.innerHTML = WORLDS.map((w, i) => {
      const lock = i >= S.unlocked, ws = S.worlds[i];
      return `<div class="item ${lock ? "no" : ""} ${i === S.world ? "max" : ""}" data-w="${i}">
        <div class="row"><span class="t">${i + 1}. ${lock ? "???" : w.name}</span><span class="lv">${i === S.world ? "HERE" : lock ? "LOCKED" : "TRAVEL"}</span></div>
        <div class="d">${lock ? "Break the portal at the bottom of the previous world" : `Portal at ${w.goal}m · deepest ${ws.max}m · ore value x${fmt(w.vm)}`}</div></div>`;
    }).join("");
    p.querySelectorAll("[data-w]").forEach(el => el.addEventListener("click", () => travel(+el.dataset.w)));
  } else if (tab === "codex") {
    const cb = codexBonus();
    p.innerHTML = `<div class="sub">Each ore found: +2% value. Each completed world: +10%. Current bonus: <b style="color:var(--accent)">x${cb.toFixed(2)}</b></div>` +
      WORLDS.map((w, wi) => wi >= S.unlocked ? `<h3>${wi + 1}. ???</h3>` :
        `<h3>${wi + 1}. ${w.name}</h3><div class="ore-grid">${w.ores.map((o, oi) => S.codex[wi + ":" + oi]
          ? `<div class="ore"><span class="sw" style="background:${o[1]}"></span>${o[0]}</div>`
          : `<div class="ore" style="color:var(--dim)"><span class="sw" style="background:#111"></span>??? <span style="margin-left:auto">${Math.ceil(o[4] * w.goal)}m+</span></div>`).join("")}</div>`).join("");
  } else if (tab === "reforge") {
    const g = pendingShards();
    p.innerHTML = `<h3>Reforge</h3>
      <div class="d" style="color:var(--dim)">Melt down your gear to forge <b>Ancient Shards</b>. Each shard permanently gives <b>+10%</b> pickaxe damage and ore value.<br><br>
      Reforging resets money, upgrades and mine progress. You keep: shards, unlocked worlds, codex.</div>
      <div class="item max" style="margin-top:10px"><div class="row"><span>Ancient Shards</span><b style="color:var(--accent)">${fmt(S.shards)}</b></div>
      <div class="row sub"><span>Current bonus</span><span>x${bonusMult().toFixed(1)}</span></div>
      <div class="row sub"><span>Earned this run</span><span>$${fmt(S.runEarned)}</span></div></div>
      <button class="big ${reforgeConfirm ? "red" : ""}" id="rf" ${g < 1 ? "disabled" : ""}>${g < 1 ? `Earn $${fmt(1e5)} this run to reforge` : reforgeConfirm ? `Click again to confirm (+${fmt(g)} shards)` : `Reforge for +${fmt(g)} shards (x${bonusMult().toFixed(1)} → x${(1 + (S.shards + g) * .1).toFixed(1)})`}</button>`;
    $("rf").addEventListener("click", reforge);
  } else {
    const st = S.stats;
    p.innerHTML = `<h3>Stats</h3><div class="item max">
      <div class="row sub"><span>Play time</span><span>${(st.time / 3600).toFixed(1)}h</span></div>
      <div class="row sub"><span>Blocks mined</span><span>${fmt(st.blocks)}</span></div>
      <div class="row sub"><span>Ores mined</span><span>${fmt(st.ores)}</span></div>
      <div class="row sub"><span>Chests found</span><span>${fmt(st.chests)}</span></div>
      <div class="row sub"><span>Reforges</span><span>${st.reforges}</span></div>
      <div class="row sub"><span>Total earned</span><span>$${fmt(S.totalEarned)}</span></div></div>
      <div class="item" id="snd"><div class="row"><span class="t">Sound</span><span>${S.sound ? "ON" : "OFF"}</span></div></div>
      <button class="big red" id="reset">${["Delete save", "Are you sure?", "Really? Click once more"][resetConfirm]}</button>
      <div class="sub" style="margin-top:10px">Game saves automatically. Robots keep earning (at half rate) for up to 8 hours while you're away.</div>`;
    $("snd").addEventListener("click", () => { S.sound = !S.sound; renderPane(); });
    $("reset").addEventListener("click", () => {
      if (++resetConfirm >= 3) { localStorage.removeItem(SAVE_KEY); S = freshRun(); cur = null; camY = drawY = 0; resetConfirm = 0; toast("Save deleted"); }
      renderPane();
    });
  }
}
function buy(id) {
  const u = UPGRADES.find(u => u.id === id), l = S.up[id];
  if (u.max && l >= u.max) return;
  const c = u.cost(l);
  if (S.money < c) return;
  S.money -= c; S.up[id]++; sfx("buy"); cur = null; renderPane(); updateUI();
}
function travel(i) {
  if (i >= S.unlocked || i === S.world) return;
  S.world = i; cur = null; drawX = WS().x; drawY = WS().y; camY = drawY - PLAYER_ROW;
  toast(`Welcome to <b>${W().name}</b>`); renderPane(); updateUI();
}
function reforge() {
  const g = pendingShards();
  if (g < 1) return;
  if (!reforgeConfirm) { reforgeConfirm = true; renderPane(); return; }
  const keep = S; keep.shards += g; keep.stats.reforges++;
  S = freshRun(keep); cur = null; drawX = 4; drawY = 0; camY = -0.5; reforgeConfirm = false;
  sfx("portal"); toast(`Reforged! You now have ${fmt(S.shards)} Ancient Shards`); save(); renderPane(); updateUI();
}
let lastPaneSig = "";
function updateUI() {
  const w = W(), ws = WS();
  $("money").textContent = "$" + fmt(S.money);
  const inc = robotIncome(S.up.robots);
  $("income").textContent = inc > 0 ? `+$${fmt(inc)}/s` : "";
  $("worldName").textContent = `World ${S.world + 1}: ${w.name}`;
  $("depth").textContent = `Depth ${ws.y}m · best ${ws.max}m`;
  $("goalBar").style.width = Math.min(100, ws.max / w.goal * 100) + "%";
  $("goalText").textContent = ws.max >= w.goal ? (S.world + 1 < WORLDS.length ? "Portal reached! Keep digging for richer ore." : "You reached the heart of the Void.") : `Portal at ${w.goal}m — ${w.goal - ws.max}m to go`;
  $("dynCount").textContent = "x" + S.dyn;
  $("dynCost").textContent = "$" + fmt(dynCost());
  $("dynBtn").classList.toggle("on", armed);
  $("dynBtn").classList.toggle("no", S.dyn <= 0);
  $("dynBuy").classList.toggle("no", S.money < dynCost());
  // refresh pane only when something visible changed
  const sig = tab + "|" + (tab === "shop" ? UPGRADES.map(u => S.up[u.id] + ":" + (S.money >= u.cost(S.up[u.id]))).join() :
    tab === "reforge" ? pendingShards() + ":" + Math.floor(Math.log10(S.runEarned + 1) * 4) : tab === "more" ? Math.floor(S.stats.time / 60) + ":" + S.stats.blocks : S.unlocked + ":" + Object.keys(S.codex).length + ":" + S.world + ":" + ws.max);
  if (sig !== lastPaneSig) { lastPaneSig = sig; renderPane(); }
}
$("dynBtn").addEventListener("click", () => { if (S.dyn > 0) { armed = !armed; if (armed) toast("Click a spot within 4 tiles to blast it"); updateUI(); } });
$("dynBuy").addEventListener("click", () => { const c = dynCost(); if (S.money >= c) { S.money -= c; S.dyn++; sfx("buy"); updateUI(); } });

let toastTimer;
function toast(html) {
  const t = $("toast"); t.innerHTML = html; t.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, 2600);
}
function showModal(title, body) { $("mTitle").innerHTML = title; $("mBody").innerHTML = body; $("modal").classList.add("on"); holding = false; }
$("mOk").addEventListener("click", () => $("modal").classList.remove("on"));
window.addEventListener("beforeunload", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

// ---------------------------------------------------------------- boot
if (load()) {
  const away = Math.min((Date.now() - S.last) / 1000, 8 * 3600);
  const gain = robotIncome(S.up.robots) * away * 0.5;
  if (gain > 0 && away > 60) { earn(gain); showModal("Welcome back!", `Your robots mined <b style="color:var(--accent)">$${fmt(gain)}</b> while you were away (${(away / 3600).toFixed(1)}h).`); }
} else {
  showModal("Pebble Miner", `Click (or hold) on the rock to dig.<br>Your miner digs toward wherever you point.<br><br>Sell nothing — ore pays out instantly. Buy upgrades, reach the <b style="color:#ff7bff">portal</b> at the bottom of each world, and unlock the next.<br><br>Seven worlds. Infinite depth. Good luck!`);
}
drawX = WS().x; drawY = WS().y; camY = drawY - PLAYER_ROW;
renderPane(); updateUI();
requestAnimationFrame(frame);
</script>
</body>
</html>
