<script>
"use strict";
// ================================================================ constants
const VW = 144, VH = 168, HUD_H = 24, LB = 24, FRONT = 92, TOOLS = 8;
const SAVE_KEY = "strataMinerSave.v1";
const C = {
  bg: "#14121c", bg2: "#1b1826", hi: "#4f4a66", lo: "#15131c", ink: "#ffffff",
  purple: "#6d1c80", purple2: "#83299a", purpleHi: "#a24bb8", purpleLo: "#3a0c45",
  yellow: "#ffe33a", yellowHi: "#fff59a", yellowLo: "#a8901a", black: "#111111",
  gold: "#ffe33a", red: "#ff5a4e", green: "#8dff6a", dim: "#d9a6e6", pit: "#b8b8b8",

// economy knobs (tuned with a headless pacing sim: ~13h to finish for an efficient player,
// with every tool in a world taking about as long as the one before)
const BAL = {
  toolGrow: 2,       // each tool digs this much faster
  toolC0: 1000,      // base tool price (the second tool is a cheap 1/6 of it)
  toolCg: 2.6,       // each tool costs this much more than the last...
  toolCgW: 0,        // ...plus this much per world
  worldVal: 1000,    // pixels are worth this much more in each new world
  // entering each world, prices rise this much more than pixel value (world 6 is gentler)
  worldHard: [17.3, 17.3, 17.3, 17.3, 10, 30],
  portalMul: 2,      // the portal costs this many times the last tool
  tEvery: 30,        // seconds between treasures, on average
  tSec: 20,          // a common treasure is worth this many seconds of digging
  clickFrac: 0.15,   // a click digs this fraction of a second of power
  clickGap: 125,     // ms between counted clicks (8/sec, same as holding)

    tools: [["Ice Pick", "pick"], ["Snow Drill", "jack"], ["Snowcat", ["#d8e8ff", "scoop"]], ["Frost Auger", ["#7fd6ff", "cone"]], ["Glacier Saw", ["#4d8bff", "saw"]], ["Cryo Laser", ["#9cf6ff", "laser"]], ["Avalanche Dozer", ["#f4f8ff", "bigcone"]], ["Polar Titan", ["#2f6bff", "vortex"]]],

    tools: [["Obsidian Pick", "pick"], ["Magma Hammer", "jack"], ["Lava Cart", ["#7a3a2a", "scoop"]], ["Magma Mole", ["#ff6a1a", "cone"]], ["Ember Saw", ["#ff2e4d", "saw"]], ["Inferno Laser", ["#ffb020", "laser"]], ["Dragon Drill", ["#9a1a1a", "bigcone"]], ["Phoenix Rig", ["#fff27a", "plasma"]]],

  { name: "Lunar Basin", sky: ["#05060f", "#1a1d33"], cloud: "#2a2d44", ground: ["#a8a8b4", "#80808c", "#5c5c68"], speck: ["#2a2a33", "#eeeeff"],
    tools: [["Moon Pick", "pick"], ["Grav Hammer", "jack"], ["Lunar Rover", ["#d8d8e0", "scoop"]], ["Crater Cutter", ["#b8c6ff", "saw"]], ["Meteor Drill", ["#8a6f5a", "cone"]], ["Photon Laser", ["#5cf0ff", "laser"]], ["Orbital Borer", ["#f6ffb0", "bigcone"]], ["Star Crawler", ["#ffffff", "plasma"]]],
    loot: [["Moon Rock", "round", "#d8d8e8", 1], ["Comet Shard", "diamond", "#5cf0ff", 2], ["Alien Vial", "potion", "#8dff6a", 5], ["Star Shard", "star", "#fff27a", 15], ["Rover Idol", "idol", "#c0c8ff", 50]] },
  { name: "Crystal Abyss", sky: ["#1a0b2e", "#3d1b6b"], cloud: "#4a2a7a", ground: ["#5a3b8f", "#45296f", "#301c52"], speck: ["#140a26", "#ff9cf7"],
    tools: [["Prism Pick", "pick"], ["Shard Hammer", "jack"], ["Geode Cart", ["#ffa3d1", "scoop"]], ["Crystal Cutter", ["#b46bff", "saw"]], ["Resonance Drill", ["#9cf6ff", "cone"]], ["Prism Laser", ["#ff5ce1", "laser"]], ["Diamond Dozer", ["#e8fbff", "bigcone"]], ["Crystal Titan", ["#ff2d6f", "vortex"]]],
    loot: [["Amethyst", "diamond", "#b46bff", 1], ["Opal", "round", "#ffeef7", 2], ["Prism Vial", "potion", "#9cf6ff", 5], ["Heart Crystal", "heart", "#ff2d6f", 15], ["Crystal Crown", "crown", "#ff5ce1", 50]] },
  { name: "The Void", sky: ["#000000", "#0b0716"], cloud: "#1a1426", ground: ["#2a2240", "#1c1630", "#100c1e"], speck: ["#05030a", "#a78bfa"],
    tools: [["Void Pick", "pick"], ["Rift Hammer", "jack"], ["Shadow Crawler", ["#4a3a6a", "scoop"]], ["Rift Saw", ["#6f6a8a", "saw"]], ["Nebula Drill", ["#c77dff", "cone"]], ["Singularity Laser", ["#4cc9f0", "laser"]], ["Plasma Bore", ["#9b5cff", "plasma"]], ["Star Eater", ["#2a2340", "vortex"]]],
    loot: [["Echo Stone", "round", "#6f6a8a", 1], ["Nebula Pearl", "round", "#c77dff", 2], ["Void Vial", "potion", "#3a0ca3", 5], ["Dark Star", "star", "#4cc9f0", 15], ["Cosmic Egg", "idol", "#ff9e00", 50]] },
];
// Multipliers persist between worlds; each world raises their level cap by `per`.
const MULTS = [
  { id: "coffee", name: "Strong Coffee", icon: "cup", per: 10, base: 42, grow: 3, desc: l => `DIG SPEED X${fmt2(Math.pow(1.15, l))}` },
  { id: "moles", name: "Helper Moles", icon: "mole", per: 10, base: 105, grow: 3, desc: l => `${l} MOLES: DIG X${fmt2(1 + l * .1)}` },
  { id: "sharp", name: "Sharp Edges", icon: "pick", per: 10, base: 28, grow: 3, desc: l => `CLICK POWER X${fmt2(1 + l * .5)}` },
  { id: "luck", name: "Lucky Charm", icon: "clover", per: 5, base: 210, grow: 3, desc: l => `TREASURE X${fmt2(1 + l * .15)} AS OFTEN` },
  { id: "apprais", name: "Appraiser", icon: "glass", per: 10, base: 280, grow: 3, desc: l => `TREASURE VALUE X${fmt2(1 + l * .3)}` },
  { id: "shift", name: "Night Shift", icon: "moon", per: 2, base: 1000, grow: 3, desc: l => `EARN ${l * 5}% WHILE AWAY` },
];

// ================================================================ state
let S;
function freshState() {
  return { px: 0, total: 0, w: 0, t: 0, dist: 0, m: { coffee: 0, moles: 0, sharp: 0, luck: 0, apprais: 0, shift: 0 },
    inv: {}, found: {}, relics: null, sec: {}, sound: true, won: false, stats: { time: 0, clicks: 0, treasures: 0, golden: 0 }, last: Date.now() };
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { const d = JSON.parse(raw); S = Object.assign(freshState(), d); S.m = Object.assign(freshState().m, d.m); return true; }
  } catch (e) {}
  S = freshState(); return false;
}
function save() { S.last = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

const W = () => WORLDS[S.w];
const tool = (w = S.w, t = S.t) => WORLDS[w].tools[t];
const worldScale = (w = S.w) => Math.pow(BAL.worldVal, w);
const priceScale = (w = S.w) => BAL.worldHard.slice(0, w).reduce((p, h) => p * h * BAL.worldVal, 1);
const toolCost = t => BAL.toolC0 * Math.pow(BAL.toolCg + BAL.toolCgW * S.w, t - 1) * priceScale() / (t === 1 ? 6 : 1);
const portalCost = () => toolCost(TOOLS - 1) * BAL.portalMul;
const multCap = m => m.per * (S.w + 1);
const multCost = m => m.base * Math.pow(m.grow, S.m[m.id] - m.per * S.w) * priceScale();
let frenzy = 0;
// dirt pixels per second (before the world's pixel value)
function power(noFrenzy) {
  const p = Math.pow(BAL.toolGrow, S.t) * Math.pow(1.15, S.m.coffee) * (1 + S.m.moles * .1);
  return p * relicMult() * (frenzy > 0 && !noFrenzy ? 7 : 1);
}
const clickPower = () => Math.max(1, power() * BAL.clickFrac) * (1 + S.m.sharp * .5);
const luckMult = () => 1 + S.m.luck * .15;

// ================================================================ treasure placement
function hash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const RARITY = [.5, .27, .14, .07, .02], SEG = 40;
// digger speed in scene pixels/sec (visual only; income comes from power)
const digSpeed = () => (10 + S.t * 1.5) * (frenzy > 0 ? 2 : 1);
// treasure buried in segment `seg` of the current layer: {i, x} or null
function treasureAt(seg) {
  const k = S.w * 100 + S.t, chance = Math.min(.9, SEG / (10 + S.t * 1.5) / BAL.tEvery * luckMult());
  if (seg < 1 || hash(seg, k, 77) >= chance) return null;
  let r = hash(seg, k, 78), i = 0;
  while (i < 4 && r > RARITY[i]) { r -= RARITY[i]; i++; }
  return { i, x: seg * SEG + 6 + hash(seg, k, 79) * (SEG - 12) };
}
const treasureValue = i => BAL.tSec * power(true) * worldScale() * W().loot[i][3] * (1 + S.m.apprais * .3);


// ================================================================ relic index (endgame collection, unlocked in the last world)
// Tiers: [name, colour, odds per treasure found (1 in N), bonus to all pixel income]
const TIERS = [["COMMON", "#c8c8c8", 25, .01], ["UNCOMMON", "#6fdc6f", 100, .02], ["RARE", "#5cb8ff", 400, .04],
  ["EPIC", "#c77dff", 1600, .08], ["LEGENDARY", "#ffb020", 6400, .15], ["MYTHIC", "#ff4d6d", 25600, .3], ["SECRET", "#ffffff", 0, .05]];
// Relic: [id, name, tier, shape, colour, hint (secrets only)]
const RELICS = [
  ["nail", "Bent Nail", 0, "diamond", "#9aa0aa"], ["boot", "Old Boot", 0, "potion", "#7a4a2a"], ["key", "Rusty Key", 0, "star", "#b86a3a"],
  ["marble", "Clay Marble", 0, "round", "#d9814a"], ["penny", "Lucky Penny", 0, "coin", "#d98a4a"], ["shell", "Fossil Shell", 0, "heart", "#e0d0b0"],
  ["lens", "Cracked Lens", 0, "round", "#bfe8ff"], ["soldier", "Tin Soldier", 0, "idol", "#a0a8b8"],
  ["compass", "Brass Compass", 1, "coin", "#e0b040"], ["eye", "Glass Eye", 1, "round", "#7fd6ff"], ["badge", "Miner's Badge", 1, "star", "#ffd23f"],
  ["spoon", "Silver Spoon", 1, "potion", "#e6eef2"], ["amberbug", "Amber Bug", 1, "heart", "#ff9f1c"], ["tooth", "Dino Tooth", 1, "diamond", "#f0ead0"],
  ["watch", "Pocket Watch", 1, "coin", "#ffe14d"],
  ["frog", "Jade Frog", 2, "idol", "#36e07a"], ["meteor", "Meteor Shard", 2, "diamond", "#8a6f5a"], ["skull", "Crystal Skull", 2, "idol", "#c0f0ff"],
  ["doubloon", "Pirate Doubloon", 2, "coin", "#ffd23f"], ["lantern", "Ghost Lantern", 2, "potion", "#8dff6a"], ["scarab", "Ruby Scarab", 2, "round", "#ff2e4d"],
  ["feather", "Phoenix Feather", 3, "star", "#ff7b00"], ["ring", "Moonstone Ring", 3, "round", "#e8e8ff"], ["egg", "Dragon Egg", 3, "heart", "#5c3b8a"],
  ["hourglass", "Hourglass", 3, "potion", "#ffcc66"],
  ["crown", "Crown of Depths", 4, "crown", "#ffd23f"], ["atlas", "Atlas Orb", 4, "round", "#4cc9f0"], ["stone", "Philosopher's Stone", 4, "diamond", "#ff2d6f"],
  ["heart", "Heart of the Planet", 5, "heart", "#ff4d6d"], ["pixel", "The First Pixel", 5, "star", "#ffffff"],
  ["cloud", "Cloud Pearl", 6, "round", "#ffffff", "THE SKY HAS POCKETS"],
  ["patience", "Patience Stone", 6, "round", "#8a8f99", "DO NOTHING AT ALL FOR TEN MINUTES"],
  ["moonlit", "Moonlit Fossil", 6, "heart", "#c0c8ff", "DIG UP TREASURE AFTER MIDNIGHT"],
  ["unlucky", "Unlucky Coin", 6, "coin", "#6a6a6a", "SELL AN UNLUCKY NUMBER OF A THING"],
  ["grip", "Iron Grip", 6, "idol", "#9aa0aa", "HOLD ON FOR A WHOLE MINUTE"],
  ["helmet", "Bruised Helmet", 6, "crown", "#e8202a", "POKE THE MINER. A LOT."],
  ["palin", "Palindrome Gem", 6, "diamond", "#ff9cf7", "MAKE PIXELS AND PPS PALINDROMES"],
  ["fork", "Tuning Fork", 6, "star", "#cfd6de", "FIDDLE WITH THE SOUND"],
  ["second", "Second Thoughts", 6, "potion", "#ff9ab0", "ALMOST DELETE YOUR SAVE, 5 TIMES"],
  ["rainbow", "Double Rainbow", 6, "star", "#ffe33a", "GET GREEDY DURING A FRENZY"],
  ["fingers", "Frenzy Fingers", 6, "heart", "#ffb020", "CLICK 140 TIMES IN ONE FRENZY"],
  ["capsule", "Time Capsule", 6, "potion", "#5cf0ff", "LEAVE FOR A WHOLE DAY"],
  ["hoard", "Dragon Hoard", 6, "crown", "#ffd23f", "HOARD 500 UNSOLD TREASURES"],
  ["prospect", "Prospector's Eye", 6, "round", "#36e07a", "INSPECT WHAT'S BURIED AHEAD"],
  ["gauge", "Depth Gauge", 6, "coin", "#79b0ea", "TAP THE DEPTH GAUGE, QUICKLY"],
  ["owl", "Night Owl", 6, "idol", "#a77bf3", "STAY FOR THREE HOURS STRAIGHT"],
];
const relicTier = r => TIERS[r[2]];
const indexOpen = () => !!S.relics;
// all pixel income gets this multiplier; duplicates add a tenth of the relic's bonus each
function relicMult() {
  if (!S.relics) return 1;
  let m = 1;
  for (const r of RELICS) { const n = S.relics.found[r[0]] || 0; if (n) m += relicTier(r)[3] * (1 + (n - 1) * .1); }
  return m;
}
function openIndex() {
  if (S.relics) return;
  S.relics = { found: {} };
  showModal("RELIC INDEX!", ["The Void hides relics: 30 buried in the dark and 16 earned in stranger ways.", "Each treasure you dig up has a tiny chance of turning up a relic. Every relic boosts your pixels forever.", "Check the new book tab."]);
  for (const id in SECRET_GOALS) if (S.sec[id] >= SECRET_GOALS[id]) giveRelic(id);
}
// counted from the start of the game, awarded once the index is open
const SECRET_GOALS = { cloud: 50, helmet: 100, prospect: 25, second: 5 };
function bump(id) { S.sec[id] = (S.sec[id] || 0) + 1; if (S.sec[id] >= SECRET_GOALS[id]) giveRelic(id); }
function giveRelic(id) {
  if (!S.relics) return;
  const r = RELICS.find(r => r[0] === id), t = relicTier(r), f = S.relics.found, first = !f[id];
  if (r[2] === 6 && !first) return; // secrets are one-off
  f[id] = (f[id] || 0) + 1;
  sfx(r[2] >= 4 ? "portal" : "rare"); shake = r[2] >= 4 ? 8 : 3;
  pops.push({ x: FRONT, y: floorY() - 40, gem: [r[3], r[4]], txt: "", c: r[4], l: 1.8 });
  if (first && (r[2] >= 4 || r[2] === 6)) showModal(r[2] === 6 ? "SECRET RELIC!" : t[0] + " RELIC!", [`You found the ${r[1]}.`, `All pixel income is now X${relicMult().toFixed(2)}.`]);
  else toast((first ? "NEW RELIC: " : "RELIC AGAIN: ") + r[1], t[1]);
}
// rolled once per treasure found
function rollRelic() {
  if (!S.relics) return;
  const roll = Math.random() / luckMult();
  let acc = 0;
  for (let tier = 5; tier >= 0; tier--) {
    acc += 1 / TIERS[tier][2];
    if (roll < acc) {
      const pool = RELICS.filter(r => r[2] === tier);
      giveRelic(pool[Math.floor(Math.random() * pool.length)][0]);
      return;
    }
  }
}
// session-only trackers for the secret relics
const SEC = { lastInput: performance.now(), holdStart: 0, sound: [], gauge: [], frenzyClicks: 0, session: 0, palinT: 0 };
function secretTick(dt, now) {
  if (!S.relics) return;
  const f = S.relics.found;
  SEC.session += dt;
  if (!f.patience && now - SEC.lastInput > 600000) giveRelic("patience");
  if (!f.grip && holding && SEC.holdStart && now - SEC.holdStart > 60000) giveRelic("grip");
  if (!f.owl && SEC.session > 3 * 3600) giveRelic("owl");
  if (!f.hoard) { let n = 0; for (const k in S.inv) n += S.inv[k].n; if (n >= 500) giveRelic("hoard"); }
  if (!f.palin && (SEC.palinT += dt) > .5) {
    SEC.palinT = 0;
    // the numbers as the HUD shows them, digits only: e.g. 12.21K and 3.03M
    const pal = v => { const d = fmt(v).replace(/[^0-9]/g, ""); return d.length >= 3 && d === [...d].reverse().join(""); };
    const big = fmt(S.px).replace(/[^0-9]/g, "").length >= 4;
    if (big && pal(S.px) && pal(ppsShown)) giveRelic("palin");
  }
}

// ================================================================ game actions
const fx = [], pops = [];
let shake = 0, digAnim = 0, earnedFrame = 0, ppsShown = 0, golden = null, goldenTimer = 40, goldenMsg = null, dropAnim = 0;

function earn(v) { S.px += v; S.total += v; earnedFrame += v; }
// move the digger forward `d` scene pixels, collecting any treasure passed
function advance(d) {
  const from = S.dist, to = from + d;
  for (let seg = Math.floor(from / SEG); seg <= Math.floor(to / SEG); seg++) {
    const t = treasureAt(seg);
    if (t && t.x > from && t.x <= to) collect(t.i);
  }
  S.dist = to;
}
function collect(i) {
  const key = S.w + ":" + i, item = W().loot[i], v = treasureValue(i);
  const st = S.inv[key] || (S.inv[key] = { n: 0, v: 0 });
  st.n++; st.v += v; S.stats.treasures++;
  if (!S.found[key]) { S.found[key] = 1; toast("NEW TREASURE: " + item[0], item[2]); }
  else toast("FOUND " + item[0], item[2]);
  pops.push({ x: FRONT, y: floorY() - 30, gem: [item[1], item[2]], txt: "", c: item[2], l: 1.4 });
  sfx(i >= 3 ? "rare" : "ore");
  if (S.relics) { if (new Date().getHours() < 4) giveRelic("moonlit"); rollRelic(); }
}
function clickDig() {
  const p = clickPower();
  earn(p * worldScale()); advance(1.5); S.stats.clicks++; digAnim = 1;
  if (frenzy > 0 && ++SEC.frenzyClicks >= 140) giveRelic("fingers");
  sfx("hit");
  debris(FRONT, floorY() - 6, groundColor(S.t), 4);
  if (Math.random() < .35) pops.push({ x: FRONT + (Math.random() - .5) * 16, y: floorY() - 34, txt: "+" + fmt(p * worldScale()), c: "#ffffff", l: .8 });
}
function sell(key) {
  const st = S.inv[key]; if (!st) return;
  if (st.n === 13) giveRelic("unlucky");
  earn(st.v); delete S.inv[key]; sfx("sell");
}
function sellAll() {
  let t = 0; for (const k in S.inv) t += S.inv[k].v;
  if (!t) return;
  if (Object.values(S.inv).some(st => st.n === 13)) giveRelic("unlucky");
  earn(t); S.inv = {}; sfx("sell"); toast("SOLD FOR $" + fmt(t), C.yellow);
}
const invTotal = () => { let t = 0; for (const k in S.inv) t += S.inv[k].v; return t; };
function buyTool() {
  if (S.t + 1 >= TOOLS) return;
  const c = toolCost(S.t + 1); if (S.px < c) return;
  S.px -= c; S.t++; S.dist = 0; dropAnim = 1; sfx("buy"); shake = 4;
  toast(`${tool()[0]}! ONE LAYER DEEPER`, C.yellow);
}
function openPortal() {
  if (S.t + 1 < TOOLS || S.w + 1 >= WORLDS.length) return;
  const c = portalCost(); if (S.px < c) return;
  S.w++; S.t = 0; S.dist = 0; S.px = 0; S.inv = {};
  sfx("portal"); shake = 10; camY = targetCamY();
  showModal("NEW WORLD!", [`Welcome to ${W().name}.`, "Your tools and pixels are gone, but your multipliers stay, and their level caps went up.", `Collect all 8 ${W().name.split(" ").pop()} tools to open the next portal.`]);

  if (!inScene(mouse)) { cancelConfirm(); return; }
  if (golden && Math.abs(mouse.x - L.sx - golden.x) < 8 && Math.abs(mouse.y - L.sy - golden.y) < 8) { clickGolden(); return; }
  pokeScene(mouse.x - L.sx, mouse.y - L.sy);
  holding = true; SEC.holdStart = performance.now();
  const now = performance.now();
  if (now >= nextClick) { clickDig(); nextClick = now + BAL.clickGap; }
});
cv.addEventListener("pointermove", e => { mouse = toLogical(e); });
addEventListener("pointerup", () => { holding = false; mouseDown = false; SEC.holdStart = 0; });
cv.addEventListener("pointerleave", () => { if (!holding) mouse = null; });
cv.addEventListener("contextmenu", e => e.preventDefault());

// ================================================================ loop
let lastT = performance.now(), saveAcc = 0;
function update(dt, now) {
  S.stats.time += dt;
  secretTick(dt, now);
  if (S.w === WORLDS.length - 1 && !S.relics && !modal) openIndex();
  if (holding && !modal && now >= nextClick) { clickDig(); nextClick = now + BAL.clickGap; }
  if (!modal) { earn(power() * worldScale() * dt); advance(digSpeed() * dt); }
  ppsShown += (earnedFrame / Math.max(dt, 1e-3) - ppsShown) * Math.min(1, dt * 1.5);
  earnedFrame = 0;
  frenzy = Math.max(0, frenzy - dt);
  if (goldenMsg && (goldenMsg.t -= dt) <= 0) goldenMsg = null;
  if (golden) { if ((golden.t -= dt) <= 0) golden = null; }
  else if ((goldenTimer -= dt) <= 0) { golden = { x: 15 + Math.random() * (VW - 30), y: HUD_H + 12 + Math.random() * (VH - HUD_H - 30), t: 9 }; goldenTimer = 50 + Math.random() * 70; }
  camY += (targetCamY() - camY) * Math.min(1, dt * 5);
  digAnim = Math.max(0, digAnim - dt * 7);
  shake = Math.max(0, shake - dt * 30);
  if (toastMsg && (toastMsg.t -= dt) <= 0) toastMsg = null;
  if (Math.random() < dt * 8) debris(FRONT, floorY() - 4 - Math.random() * 10, groundColor(S.t), 1);
  for (let i = fx.length - 1; i >= 0; i--) { const p = fx[i]; p.x += p.vx * dt - digSpeed() * dt; p.y += p.vy * dt; p.vy += 240 * dt; p.l -= dt; if (p.l <= 0) fx.splice(i, 1); }
  for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.y -= 16 * dt; p.l -= dt; if (p.l <= 0) pops.splice(i, 1); }
  saveAcc += dt; if (saveAcc > 10) { saveAcc = 0; save(); }
}
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  update(dt, now);
  regions = []; tip = null;
  drawBackground();
  drawFrame();
  const sh = shake > 0 ? Math.round((Math.random() - .5) * shake) : 0;
  cx.save(); cx.beginPath(); cx.rect(L.sx, L.sy, VW, VH); cx.clip(); cx.translate(L.sx + sh, L.sy);
  drawScene(now);
  cx.restore();
  if (modal) { const keep = mouse; mouse = null; drawPanel(now); mouse = keep; regions = []; }
  else drawPanel(now);
  drawToast();
  drawTip();
  drawModal();
  drawCursor();
  requestAnimationFrame(frame);
}

function fmt(n) {
  if (!isFinite(n)) return "INF";
  if (n < 10) return (Math.floor(n * 10) / 10).toString();
  if (n < 1000) return Math.floor(n).toString();
  const u = ["", "K", "M", "B", "T", "QA", "QI", "SX", "SP", "OC", "NO", "DC"];
  const e = Math.floor(Math.log10(n) / 3);
  if (e < u.length) { const m = n / Math.pow(1000, e); return m.toFixed(m < 100 ? 2 : 1) + u[e]; }
  return n.toExponential(2).replace("+", "").toUpperCase();
}
// full digits with commas, like the original HUD, until it no longer fits
const fmtC = n => n < 1e12 ? Math.floor(n).toLocaleString("en-US") : fmt(n);
const fmt2 = n => n < 100 ? n.toFixed(2).replace(/\.?0+$/, "") : fmt(n);
addEventListener("beforeunload", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

// ================================================================ boot
layout();
if (load()) {
  const away = Math.min((Date.now() - S.last) / 1000, 12 * 3600), frac = S.m.shift * .05;
  const gain = power(true) * worldScale() * away * frac;
  if (gain > 0 && away > 60) { earn(gain); showModal("WELCOME BACK!", [`Your night shift dug up $${fmt(gain)} while you were away (${(away / 3600).toFixed(1)}h).`]); }
  if ((Date.now() - S.last) / 1000 >= 86400) giveRelic("capsule");
} else {
  showModal("STRATA MINER", ["Your miner digs on their own. Click or hold on the screen to dig faster.", "Each new tool takes you one layer deeper. Get all 8 to open the portal to the next world.", "Multipliers dig quicker. Sell the treasure you dig up."]);
}
camY = targetCamY();
requestAnimationFrame(frame);
</script>
